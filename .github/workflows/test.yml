name: test

on:
  push:
    branches: [develop, main]
  pull_request:

permissions: read-all

jobs:
  go:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Go version comes from go.mod, so the workflow tracks the toolchain
      # automatically (with the module cache for speed).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: verify module checksums
        run: go mod verify

      - name: gofmt is clean
        run: test -z "$(gofmt -l .)"

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -count=1 ./...

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build image
        run: docker build -t email-mcp:ci .

      - name: smoke test container
        run: |
          # Fail-fast startup requires a stable signing key + token secret;
          # generate an ephemeral RSA key for the smoke test.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/email-mcp-ci-key.pem
          docker run -d -p 18080:8080 --name email-mcp-ci \
            -e EMAIL_MCP_SIGNING_KEY="$(base64 -w0 /tmp/email-mcp-ci-key.pem)" \
            -e EMAIL_MCP_TOKEN_SECRET=ci-smoke-test-secret-32bytes!! \
            email-mcp:ci
          trap 'docker stop email-mcp-ci >/dev/null 2>&1; docker rm email-mcp-ci >/dev/null 2>&1' EXIT
          # Surface why the container died instead of just failing the curls.
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18080/ >/dev/null && break
            docker logs email-mcp-ci 2>/dev/null | tail -5
            sleep 0.5
          done
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18080/ && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18080/ | grep -q '"service":"email-mcp"'
          # Browser page: OAuth how-to (no setup form anymore).
          curl -sf -H 'Accept: text/html' http://127.0.0.1:18080/ | grep -q '/oauth/authorize'
          # Unauthenticated /mcp must answer 401 with an OAuth challenge.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}')
          test "$code" = 401
          curl -s -D - -o /dev/null -X POST http://127.0.0.1:18080/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | grep -qi 'www-authenticate:.*oauth-protected-resource'
          # Fail-fast: a container without the required env must refuse to start.
          if docker run --rm email-mcp:ci >/dev/null 2>&1; then
            echo 'ERROR: container started without EMAIL_MCP_SIGNING_KEY/EMAIL_MCP_TOKEN_SECRET'
            exit 1
          fi
